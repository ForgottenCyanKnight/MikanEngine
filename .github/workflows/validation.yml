name: MikanEngine validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scene-validation:
    name: Validate sample scenes
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate scenes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\tools\validate_scene.ps1 `
            .\projects\third-person-navigation\scenes\main.json `
            -ProjectPath .\projects\third-person-navigation `
            -CheckAssets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\validate_scene.ps1 `
            .\projects\third-person-navigation\scenes\terrain.json `
            -ProjectPath .\projects\third-person-navigation `
            -CheckAssets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-build:
    name: Build Windows engine and project plugin
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 构建目录缓存：Jolt/引擎的 .obj 按 Ninja 依赖增量复用，二次推送只重编
      # 改动文件（首跑仍全量 ~15min，命中后降到 1-3min）。CMake/Ninja 依赖
      # 跟踪可靠（.inl 已用 OBJECT_DEPENDS 显式声明），缓存目录直接可用。
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: out/build/x64-Release
          key: build-x64-release-${{ hashFiles('CMakeLists.txt', 'src/**', 'engine/shaders/glsl/**', 'dependencies/JoltPhysics/**') }}
          restore-keys: |
            build-x64-release-

      - name: Configure
        shell: pwsh
        run: cmake --preset x64-release

      - name: Build engine
        shell: pwsh
        run: cmake --build --preset x64-release --target MikanEngine --parallel 2

      - name: Build sample gameplay plugin
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\compile_games.ps1 -ProjectPath .\projects\third-person-navigation
